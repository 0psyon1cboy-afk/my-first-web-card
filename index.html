<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Store — Магазин часов</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <div class="logo">WATCH<span>STORE</span></div>
            <nav class="nav-menu">
                <a href="#">Каталог</a>
                <a href="#">Мужское</a>
                <a href="#">Женское</a>
            </nav>
            <div class="cart-widget">
                <div class="cart-icon">
                    🛒 <span class="cart-count">0</span>
                </div>
            </div>
        </div>
    </header>

    <main class="content">
        <div class="product-grid">
            <article class="product-card">
                <div class="product-image">
                    <img src="images/watches.png" alt="Classic Watch">
                </div>
                <div class="product-info">
                    <h2 class="product-title">Suunto Race Steel Midnight</h2>
                    <p class="product-description">
                        Премиальные стальные часы с удобным резиновым ремнем, защитой от царапин и японским механизмом.
                    </p>
                    <div class="product-footer">
                        <span class="product-price">24 900 ₽</span>
                        <button class="add-to-cart">Добавить в корзину</button>
                    </div>
                </div>
            </article>
        </div>
    </main>

</body>
</html>
